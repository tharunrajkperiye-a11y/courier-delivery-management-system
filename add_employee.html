{% extends "base.html" %}

{% block title %}
Add Employee - CourierFlow
{% endblock %}


{% block content %}

<div class="page-header">

    <h1>Add Employee</h1>

    <p>
        Register courier staff information
    </p>

</div>


<div class="form-card">

    <form method="POST">


        <div class="form-group">

            <label>Employee Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter employee name"
                required
            >

        </div>


        <div class="form-group">

            <label>Phone Number</label>

            <input
                type="text"
                name="phone"
                placeholder="Enter phone number"
                required
            >

        </div>


        <div class="form-group">

            <label>Designation</label>

            <input
                type="text"
                name="designation"
                placeholder="Delivery Executive"
                required
            >

        </div>


        <button class="btn btn-primary" type="submit">
            Add Employee
        </button>

        <a href="/" class="btn btn-secondary">
            Cancel
        </a>


    </form>

</div>

{% endblock %}
