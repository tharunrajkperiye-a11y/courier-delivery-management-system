{% extends "base.html" %}
{% block title %}Add Employee | CourierFlow{% endblock %}
{% block content %}
<div class="panel">
  <h1>Add Employee</h1>
  <form method="post" class="form">
    <label>Employee Name</label><input name="name" required>
    <label>Phone</label><input name="phone" required>
    <label>Designation</label><input name="designation" required>
    <button class="btn" type="submit" style="margin-top:16px">Save Employee</button>
  </form>
</div>
{% endblock %}
