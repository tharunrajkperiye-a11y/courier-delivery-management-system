{% extends "base.html" %}

{% block title %}Add Employee - CourierFlow{% endblock %}

{% block content %}

<div class="page-header">
    <h1>Add Employee / Staff Login</h1>
    <p>Create an employee record and their staff login together.</p>
</div>

<div class="form-card">

    <form method="post">

        <div class="form-group">
            <label>Employee Name</label>
            <input
                type="text"
                name="name"
                placeholder="Enter employee name"
                required
            >
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input
                type="text"
                name="phone"
                placeholder="Enter phone number"
                required
            >
        </div>

        <div class="form-group">
            <label>Designation</label>
            <input
                type="text"
                name="designation"
                placeholder="Delivery Executive"
                required
            >
        </div>

        <hr>

        <h3>Staff Login Details</h3>

        <div class="form-group">
            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Create a username"
                autocomplete="username"
                required
            >
        </div>

        <div class="form-group">
            <label>Password (minimum 8 characters)</label>
            <input
                type="password"
                name="password"
                minlength="8"
                autocomplete="new-password"
                placeholder="Create a password"
                required
            >
        </div>

        <button class="btn btn-primary" type="submit">
            Create Employee and Login
        </button>

        <a href="/" class="btn btn-secondary">Cancel</a>

    </form>

</div>

{% endblock %}
