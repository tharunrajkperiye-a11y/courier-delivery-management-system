{% extends "base.html" %}

{% block title %}
Book Parcel - CourierFlow
{% endblock %}


{% block content %}

<div class="page-header">

    <h1>Book Parcel</h1>

    <p>
        Create a new courier shipment
    </p>

</div>


<div class="form-card">

    <form method="POST">


        <div class="form-group">

            <label>Tracking Number</label>

            <input
                type="text"
                name="tracking_number"
                placeholder="Example: CDM1001"
                required
            >

        </div>


        <div class="form-group">

            <label>Sender</label>

            <select name="sender_id" required>

                <option value="">
                    Select customer
                </option>

                {% for customer in customers %}

                <option value="{{ customer.customer_id }}">

                    {{ customer.name }}
                    - {{ customer.phone }}

                </option>

                {% endfor %}

            </select>

        </div>


        <div class="form-group">

            <label>Receiver Name</label>

            <input
                type="text"
                name="receiver_name"
                placeholder="Enter receiver name"
                required
            >

        </div>


        <div class="form-group">

            <label>Receiver Phone</label>

            <input
                type="text"
                name="receiver_phone"
                placeholder="Enter receiver phone"
                required
            >

        </div>


        <div class="form-group">

            <label>Destination</label>

            <input
                type="text"
                name="destination"
                placeholder="Enter destination"
                required
            >

        </div>


        <div class="form-group">

            <label>Weight (kg)</label>

            <input
                type="number"
                step="0.01"
                name="weight"
                placeholder="0.00"
                required
            >

        </div>


        <div class="form-group">

            <label>Booking Date</label>

            <input
                type="date"
                name="booking_date"
                value="{{ today }}"
                required
            >

        </div>


        <div class="form-group">

            <label>Assigned Employee</label>

            <select name="employee_id" required>

                <option value="">
                    Select employee
                </option>

                {% for employee in employees %}

                <option value="{{ employee.employee_id }}">

                    {{ employee.name }}
                    - {{ employee.designation }}

                </option>

                {% endfor %}

            </select>

        </div>


        <button class="btn btn-primary" type="submit">
            Book Parcel
        </button>

        <a href="/" class="btn btn-secondary">
            Cancel
        </a>


    </form>

</div>

{% endblock %}
