{% extends "base.html" %}

{% block title %}
Payments - CourierFlow
{% endblock %}


{% block content %}

<div class="page-header">

    <h1>Record Payment</h1>

    <p>
        Add payment information for a parcel
    </p>

</div>


<div class="form-card">

    <form method="POST">


        <div class="form-group">

            <label>Parcel</label>

            <select name="parcel_id" required>

                <option value="">
                    Select parcel
                </option>

                {% for parcel in parcels %}

                <option value="{{ parcel.parcel_id }}">

                    {{ parcel.tracking_number }}

                </option>

                {% endfor %}

            </select>

        </div>


        <div class="form-group">

            <label>Amount</label>

            <input
                type="number"
                step="0.01"
                name="amount"
                placeholder="Enter amount"
                required
            >

        </div>


        <div class="form-group">

            <label>Payment Date</label>

            <input
                type="date"
                name="payment_date"
                value="{{ today }}"
                required
            >

        </div>


        <div class="form-group">

            <label>Payment Method</label>

            <select name="payment_method" required>

                <option value="Cash">
                    Cash
                </option>

                <option value="UPI">
                    UPI
                </option>

                <option value="Card">
                    Card
                </option>

                <option value="Bank Transfer">
                    Bank Transfer
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>Payment Status</label>

            <select name="payment_status" required>

                <option value="Paid">
                    Paid
                </option>

                <option value="Pending">
                    Pending
                </option>

            </select>

        </div>


        <button class="btn btn-primary" type="submit">
            Record Payment
        </button>

        <a href="/" class="btn btn-secondary">
            Cancel
        </a>


    </form>

</div>

{% endblock %}
