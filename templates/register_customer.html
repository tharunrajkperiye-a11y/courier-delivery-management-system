{% extends "base.html" %}

{% block title %}Customer Registration - CourierFlow{% endblock %}

{% block content %}

<div class="auth-wrap">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p class="muted">
            Register to track parcels linked to your account.
        </p>

        <form method="POST">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                >
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="Enter your address"
                >
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Create a username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password (minimum 8 characters)</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button
                class="btn btn-primary"
                type="submit"
                style="width: 100%;"
            >
                Create Account
            </button>

        </form>

        <div class="auth-links">
            Already registered?
            <a href="{{ url_for('login') }}">Sign in</a>
        </div>

    </div>

</div>

{% endblock %}
