
{% extends "base.html" %}

{% block title %}Add Employee | CourierFlow{% endblock %}

{% block content %}

<div class="panel">
    <h1>Add Employee</h1>

    <form method="post" class="form">

        <label>Employee Name</label>
        <input
            type="text"
            name="name"
            placeholder="Enter employee name"
            required
        >

        <label>Phone Number</label>
        <input
            type="text"
            name="phone"
            placeholder="Enter phone number"
            required
        >

        <label>Designation</label>
        <input
            type="text"
            name="designation"
            placeholder="Delivery Executive"
            required
        >

        <button class="btn" type="submit" style="margin-top:16px">
            Save Employee
        </button>

    </form>
</div>

{% endblock %}
