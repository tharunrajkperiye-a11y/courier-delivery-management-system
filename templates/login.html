{% extends "base.html" %}
{% block title %}Admin Login | CourierFlow{% endblock %}
{% block content %}
<div class="panel" style="max-width:430px;margin:55px auto">
  <h1>Admin Login</h1>
  <p class="muted">Sign in to manage CourierFlow records.</p>
  <form method="post" class="form">
    <label>Username</label><input name="username" required>
    <label>Password</label><input type="password" name="password" required>
    <button class="btn" style="margin-top:18px;width:100%" type="submit">Login</button>
  </form>
</div>
{% endblock %}
