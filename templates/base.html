<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CourierFlow{% endblock %}</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#172033}
    header{background:#101d35;color:white;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
    header strong{font-size:22px}nav{display:flex;gap:15px;align-items:center;flex-wrap:wrap}
    nav a{color:white;text-decoration:none;font-size:14px}.logout{background:#e9eef7;color:#14213a;border:0;padding:8px 12px;border-radius:6px;cursor:pointer}
    main{max-width:1200px;margin:28px auto;padding:0 18px}.panel{background:white;padding:20px;border-radius:10px;margin-bottom:22px;box-shadow:0 2px 10px #15233a0c}
    h1{margin-top:0}h2{font-size:19px;margin-top:0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
    .stat{background:#fff;border:1px solid #e4e9f1;border-radius:9px;padding:16px}.stat span{display:block;color:#657187;font-size:13px}.stat b{font-size:25px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.btn{display:inline-block;background:#2459a6;color:white;text-decoration:none;border:0;border-radius:6px;padding:10px 14px;cursor:pointer}
    table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e8edf3;font-size:13px}th{background:#f5f7fa}
    .table-wrap{overflow-x:auto}label{display:block;margin:12px 0 5px;font-size:14px}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd5e1;border-radius:6px}
    form.form{max-width:550px}.flash{background:#fff3cd;padding:10px;border-radius:6px;margin-bottom:12px}
    .muted{color:#68758a;font-size:13px}
  </style>
</head>
<body>
<header>
  <strong>CourierFlow</strong>
  {% if session.get('admin_logged_in') %}
  <nav>
    <a href="{{ url_for('home') }}">Dashboard</a>
    <a href="{{ url_for('add_customer') }}">Add Customer</a>
    <a href="{{ url_for('add_employee') }}">Add Employee</a>
    <a href="{{ url_for('book_parcel') }}">Book Parcel</a>
    <a href="{{ url_for('update_status') }}">Update Status</a>
    <a href="{{ url_for('payment') }}">Payment</a>
    <form method="post" action="{{ url_for('logout') }}" style="margin:0">
      <button class="logout" type="submit">Logout</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>
  {% with messages = get_flashed_messages() %}
    {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
